<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>ISP06</title>
<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<style>
.card {border:1px solid #000; padding:5px; margin:5px; width:100px;}
</style>
</head>
<body>
<input type="text" id="name">
<button id="add">追加</button>
<div id="list"></div>

<script>
$(function(){
  let arr = [];
  $("#add").click(function(){
    let n = $("#name").val().trim();
    if(n!=""){
      arr.push(n); 
      show(); 
      $("#name").val("");
    }
  });
  function show(){
    $("#list").html("");
    for(let i=0; i<arr.length; i++){
      $("#list").append("<div class='card'>"+arr[i]+"</div>");
    }
  }
});
</script>
</body>
</html>
