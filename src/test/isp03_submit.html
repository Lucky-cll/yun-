<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ISP03</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <style>
      .ok {
        color: green;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <input type="text" id="name" />
    <button id="check">確認</button>
    <p id="result"></p>

    <script>
      $(function () {
        $('#check').on('click', function () {
          var value = $('#name').val().trim()
          $('#result').removeClass('ok error')
          if (value === '') {
            $('#result').addClass('error')
            $('#result').text('入力してください')
          } else if (value.length < 5) {
            $('#result').addClass('error')
            $('#result').text('5文字以上で入力してください')
          } else {
            $('#result').addClass('ok')
            $('#result').text(('ようこそ ' + value).trim())
            $('#name').val('')
            $('#name').focus()
          }
        })
        $('#name').on('keyup', function (e) {
          if (e.key === 'Enter') {
            $('#check').click()
          }
        })
      })
    </script>
  </body>
</html>
