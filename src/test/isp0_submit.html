<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ISP06</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <style>
      .card {
        border: 1px solid #000;
        padding: 8px;
        margin: 5px;
        width: 120px;
      }
      #box {
        border: 2px solid pink;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <input type="text" id="name" placeholder="名前" />
    <button id="add">追加</button>
    <div id="box"></div>

    <script>
      var users = []

      $(function () {
        $('#add').on('click', function () {
          var name = $('#name').val().trim()
          if (name === '') {
            alert('名前を入力してください')
            return
          }
          users.push(name)
          render()
          $('#name').val('')
        })
      })
      function render() {
        $('#box').html('')
        for (var i = 0; i < users.length; i++) {
          $('#box').append("<div class='card'>" + users[i] + '</div>')
        }
      }
    </script>
  </body>
</html>
